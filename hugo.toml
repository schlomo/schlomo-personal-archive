baseURL = "https://archive.schlomo.schapiro.org"
locale = "en-US"
title = "Schlomo Schapiro Personal Archive Of Public Files"

# SEO essentials
enableRobotsTXT = true

# Disable unused taxonomies
disableKinds = ["taxonomy", "term"]

# Configure outputs - main HTML and Atom feed (using RSS config for compatibility)
# Note: index.xml template contains Atom format with Media RSS extensions
[outputs]
home = ["HTML", "RSS"]
section = ["HTML"]

[params]
description = "Public archive of presentations, talks, and documents by Schlomo Schapiro on DevOps, Linux, Security, and Technology."
author = "Schlomo Schapiro"
# Short site name shown by Google in search results (WebSite.name, og:site_name)
siteName = "Schlomo Schapiro"
# Link preview image (1200x630) for Open Graph / Twitter cards
ogImage = "/og-image.jpg"
ogImageAlt = "Schlomo Schapiro – Personal Archive of Public Files: talks, presentations and documents"
homepage = "https://schlomo.schapiro.org"

# Year directories for content generation (newest first)
years = ["2026", "2025", "2024", "2023", "2022", "2005-2016"]

# The site's color palette. Single source of truth: layouts/_default/baseof.html emits every
# entry as a CSS custom property (primary-color -> --primary-color) before the stylesheet.
# Never hard-code a color in assets/css/style.css or the templates.
[params.colors]
primary-color = "#2c5aa0"    # headings gradient start, links on hover, hover backgrounds
secondary-color = "#4a90e2"  # links, gradient end, hover borders
accent-color = "#7b68ee"     # year label in section headers
text-color = "#2c3e50"       # body text
text-light = "#6c757d"       # secondary text
background = "#f8fafc"       # page background
surface = "#ffffff"          # cards, buttons; text on primary-color backgrounds
border = "#e2e8f0"           # card and thumbnail borders
