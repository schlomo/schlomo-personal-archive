name: Deploy Hugo site to GitHub Pages

on: push

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch: a newer push cancels the older run on the same branch,
# but a feature-branch push no longer cancels an in-progress main deployment.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      # Install Hugo from the pinned, checksum-verified release .deb instead of snap:
      # `snap install hugo` took ~20 minutes per run, the rest of the job takes ~1 minute.
      # yq is preinstalled on GitHub's ubuntu runner images.
      - name: Install dependencies
        env:
          HUGO_VERSION: 0.169.0
          HUGO_SHA256: a20f7da84e0981bebbecc032cc87f0dda2049a844727720aab14e61ce416e5e9
        run: |
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL -o "$RUNNER_TEMP/$deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/$deb"
          command -v yq >/dev/null || sudo snap install yq
          sudo apt-get update
          sudo apt-get install -y imagemagick ghostscript
          hugo version
          yq --version
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # Use the consolidated build script with GitHub Pages base URL and production optimizations
          ./build.sh -b "${{ steps.pages.outputs.base_url }}/" -p
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job - only runs for main branch
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
